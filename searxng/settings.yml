# see
# https://docs.searxng.org/admin/settings/settings.html#settings-use-default-settings
use_default_settings: true
server:
  # base_url is defined in the SEARXNG_BASE_URL environment variable,
  # see .env and docker-compose.yml
  secret_key: "627f8299-3708-4340-ad09-1cbacb774489" # change this!
  # enable limiter when running this instance for public internet usage
  limiter: false
  image_proxy: true
redis:
  url: redis://redis:6379/0

# JSON is mandatory for the crw-stack search backend: CRW calls
# /search?format=json and stock SearXNG only enables html, so every
# /v1/search answers 403 without this block.
search:
  formats:
    - html
    - json
