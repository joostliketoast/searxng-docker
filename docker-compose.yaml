services:
  redis:
    mem_limit: 256m
    container_name: redis
    image: docker.io/valkey/valkey:8-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    networks:
      - searxng
    volumes:
      - valkey-data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  searxng:
    mem_limit: 384m
    container_name: searxng
    # Pinned 2026-09-30. Never :latest — an unpinned tag makes the
    # search backend drift silently, and a stale SearXNG returns
    # "0 results" instead of an error. crw consumes this instance's JSON API
    # (search.formats in searxng/settings.yml), so keep it current.
    image: docker.io/searxng/searxng:2026.9.30-a9d990033
    restart: unless-stopped
    networks:
      - searxng
    ports:
      - "8002:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
      - searxng-data:/var/cache/searxng:rw
    environment:
      - SEARXNG_HOSTNAME=0.0.0.0
      - SEARXNG_BASE_URL=https://${SEARXNG_HOSTNAME:-localhost}/
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

networks:
  searxng:

volumes:
  valkey-data:
    driver_opts:
      type: none
      device: /mnt/disk-b/searxng-valkey-data
      o: bind
  searxng-data:
    driver_opts:
      type: none
      device: /mnt/disk-b/searxng-data
      o: bind
